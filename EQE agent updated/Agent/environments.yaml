# ═══════════════════════════════════════════════════════════════════════════════
# Agent/environments.yaml — Environment configs per product area
# ═══════════════════════════════════════════════════════════════════════════════
#
# Each product area team fills in THEIR section only.
# Secrets use ${ENV_VAR_NAME} — resolved at runtime by Agent/env_config.py.
# NEVER store plaintext passwords.
#
# TO ADD A NEW PRODUCT AREA: copy the template at the bottom.
# ═══════════════════════════════════════════════════════════════════════════════

# ─── TIDAL (shared across all product areas) ─────────────────────────────────
tidal:
  qa:
    mode: "api"                       # "api" or "ssh"
    api_base_url: ""                  # e.g. https://tidal-qa.caresource.corp/api/v1
    api_token: "${TIDAL_QA_TOKEN}"
    ssh_host: ""
    ssh_port: 22
    ssh_user: "${TIDAL_SSH_USER}"
    ssh_key_path: ""
    ssl_verify: false
  crt:
    mode: "api"
    api_base_url: ""
    api_token: "${TIDAL_CRT_TOKEN}"
    ssh_host: ""
    ssh_port: 22
    ssh_user: "${TIDAL_SSH_USER}"
    ssh_key_path: ""
    ssl_verify: false
  prd:
    mode: "api"
    api_base_url: ""
    api_token: "${TIDAL_PRD_TOKEN}"
    ssl_verify: true

# ─── CLINICAL AUTOMATION ─────────────────────────────────────────────────────
clinical_automation:
  qa:
    db:
      server: "INT_72.SQL.CARESOURCE.CORP\\INT_72"
      database: "EDWStageDB"
      driver: "{ODBC Driver 17 for SQL Server}"
      trusted_connection: true
  api:
      base_url: "https://int-clinicalservices.caresource.corp/UM/FaxIntegration/v2"
      auth_type: "bearer"
      token: "${CLINICAL_API_TOKEN_QA}"
      ssl_verify: false
      timeout: 30
  files:
      source_dir: "\\daycrtappfs01\\SSIS_Shared\\Source_Files\\Care Model"
      output_dir: "\\daycrtappfs01\\SSIS_Shared\\Target_Files\\Care Model"
      archive_dir: "Based in module Archive path vary"
      error_dir: "Error mail will be triggered"
  crt:
    db:
      server: ""
      database: ""
      driver: "{ODBC Driver 17 for SQL Server}"
      trusted_connection: true
    api:
      base_url: ""
      auth_type: "bearer"
      token: "${CLINICAL_API_TOKEN_CRT}"
      ssl_verify: false
      timeout: 30

