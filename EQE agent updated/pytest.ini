[pytest]
addopts = --html=reports/latest_report.html --self-contained-html --alluredir=reports/allure-results --junitxml=reports/junit.xml --reruns=1 --reruns-delay=2
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
python_files = test_*.py tc_*.py
python_functions = test_*
testpaths = tests
markers =
    api: api test suite
    api_integration: live api integration tests
    smoke: smoke test suite
    regression: regression suite
    sanity: sanity checks
    chat: chat feature tests
    file: file handling feature tests
    prompt: prompt library feature tests
    flaky: potentially flaky tests
    temporary_chat: temporary chat session tests (TC044-TC055)
    p1: priority 1 suite
    p2: priority 2 suite
    web_suite: grouped web suite tests
log_cli = true
log_cli_level = INFO
